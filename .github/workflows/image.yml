name: Build course image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["image-v*"]

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: lab9-hadoop:ci

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate repository contracts
        run: python tests/validate_repository.py
      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
      - name: Smoke-test Hadoop health
        run: tests/smoke_image.sh "$TEST_IMAGE"

  publish:
    if: startsWith(github.ref, 'refs/tags/image-v')
    needs: validate-and-smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable image tag
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#image-v}"
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          provenance: mode=max
          sbom: true
